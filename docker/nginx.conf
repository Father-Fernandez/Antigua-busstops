server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/x-icon application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Runtime config is rewritten on every start; never cache it.
    location = /config.js {
        expires -1;
        try_files $uri =404;
    }

    # The web app manifest (nginx's default mime.types predates .webmanifest).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Single-page app: unknown paths fall back to index.html (kept uncached).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
