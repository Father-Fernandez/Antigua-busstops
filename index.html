<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Stop Antigua — Getting Around Made Easy</title>
    <meta
      name="description"
      content="Plan bus journeys across Antigua: search routes, stops and fares for the island's public bus network."
    />
    <meta name="theme-color" content="#d32630" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2b2b23" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bus Stop Antigua" />
    <meta property="og:title" content="Bus Stop Antigua — Getting Around Made Easy" />
    <meta
      property="og:description"
      content="Plan bus journeys across Antigua: search routes, stops and fares for the island's public bus network."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bus Stop Antigua — Getting Around Made Easy" />
    <meta
      name="twitter:description"
      content="Plan bus journeys across Antigua: search routes, stops and fares for the island's public bus network."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('bus-system-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
